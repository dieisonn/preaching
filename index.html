<title>Meu relatório</title>
<style>
html,body{margin:0;height:100%;background:#fff}
#splash{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease,visibility .35s}
#splash img{width:120px;height:120px;border-radius:27px;box-shadow:0 6px 24px rgba(232,80,142,.35);animation:pop .6s ease-out both}
#splash span{font:700 22px/1 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#c43a74}
#splash.hide{opacity:0;visibility:hidden}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icons/icon-192.png" alt=""><span>Meu relatório</span></div>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
